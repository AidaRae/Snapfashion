<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spodut – Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                    },
                    colors: {
                        brand: { DEFAULT: '#3b82f6', light: '#3b82f6', pale: '#EEE9FE' }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease;
        }

        body {
            font-family: 'DM Sans', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 99px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #374151;
        }

        .toggle-track {
            width: 40px;
            height: 22px;
            border-radius: 99px;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }

        .toggle-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            transition: left 0.2s ease;
        }

        .light .toggle-track {
            background: #e5e7eb;
        }

        .light .toggle-thumb {
            left: 3px;
            background: #6b7280;
        }

        .dark .toggle-track {
            background: #3b82f6;
        }

        .dark .toggle-thumb {
            left: 21px;
            background: #fff;
        }

        .nav-active {
            background: #EEE9FE;
            color: #3b82f6;
            font-weight: 600;
        }

        .dark .nav-active {
            background: rgba(97, 68, 245, 0.18);
            color: #60a5fa;
        }

        .add-btn {
            background: #3b82f6;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(97, 68, 245, 0.3);
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #2563eb;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .row-hover:hover {
            background-color: rgba(97, 68, 245, 0.04);
        }

        .dark .row-hover:hover {
            background-color: rgba(97, 68, 245, 0.08);
        }

        .prod-img {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .page-num {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        .page-num.active {
            background: #3b82f6;
            color: #fff;
        }

        .page-num:not(.active):hover {
            background: #f3f4f6;
        }

        .dark .page-num:not(.active):hover {
            background: #374151;
        }

        input[type=checkbox] {
            accent-color: #3b82f6;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        #sidebar {
            transition: transform 0.28s cubic-bezier(.4, 0, .2, 1);
        }

        #sidebarOverlay {
            transition: opacity 0.28s ease;
        }

        #bottomNav {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .sort-icon {
            opacity: 0.4;
            margin-left: 3px;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-neutral-900 min-h-screen">

    <!-- Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-20 hidden opacity-0 lg:hidden" onclick="closeSidebar()">
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="fixed left-0 top-0 bottom-0 z-30 w-60 bg-white dark:bg-neutral-800 border-r border-gray-100 dark:border-neutral-700 flex flex-col justify-between py-6 px-4 -translate-x-full lg:translate-x-0">
        <div>
            <div class="flex items-center justify-between mb-8 px-2">
                <div class="flex items-center gap-2">
                    <svg width="34" height="20" viewBox="0 0 34 20" fill="none">
                        <rect x="0" y="6" width="10" height="10" rx="3" fill="#3b82f6" opacity="0.7" />
                        <rect x="12" y="2" width="10" height="14" rx="3" fill="#3b82f6" />
                        <rect x="24" y="6" width="10" height="10" rx="3" fill="#3b82f6" opacity="0.4" />
                    </svg>
                    <span style="font-family:'Syne',sans-serif;font-weight:700;"
                        class="text-xl tracking-tight text-brand">Spodut</span>
                </div>
                <button onclick="closeSidebar()"
                    class="lg:hidden text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24">
                        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <nav class="space-y-1">
                <a href="#" onclick="closeSidebar()"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-neutral-700 text-sm">
                    <svg width="17" height="17" fill="none" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor" opacity=".7" />
                        <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor" />
                        <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor" />
                        <rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity=".7" />
                    </svg>
                    Dashboard
                </a>
                <div>
                    <a href="#" class="flex items-center justify-between px-3 py-2.5 rounded-xl nav-active text-sm">
                        <span class="flex items-center gap-3">
                            <svg width="17" height="17" fill="none" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                                <circle cx="12" cy="12" r="3" fill="currentColor" />
                            </svg>
                            Products
                        </span>
                        <svg width="14" height="14" fill="none" viewBox="0 0 24 24">
                            <path d="M6 9l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </a>
                    <div class="ml-8 mt-1 space-y-0.5">
                        <a href="#"
                            class="block px-3 py-2 rounded-lg text-sm text-brand font-semibold dark:text-blue-400 bg-brand-pale dark:bg-blue-900/30">Product
                            List</a>
                        <a href="#"
                            class="block px-3 py-2 rounded-lg text-sm text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-neutral-700">Categories</a>
                    </div>
                </div>
                <a href="#" onclick="closeSidebar()"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-neutral-700 text-sm">
                    <svg width="17" height="17" fill="none" viewBox="0 0 24 24">
                        <path d="M3 17l4-8 4 4 4-6 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    Sales
                </a>
                <a href="#" onclick="closeSidebar()"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-neutral-700 text-sm">
                    <svg width="17" height="17" fill="none" viewBox="0 0 24 24">
                        <circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="2" />
                        <path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2M16 3.13a4 4 0 010 7.75M21 21v-2a4 4 0 00-3-3.87"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    Customers
                </a>
                <a href="#" onclick="closeSidebar()"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-neutral-700 text-sm">
                    <svg width="17" height="17" fill="none" viewBox="0 0 24 24">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" fill="none" />
                    </svg>
                    Analytics
                </a>
                <a href="#" onclick="closeSidebar()"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-neutral-700 text-sm">
                    <svg width="17" height="17" fill="none" viewBox="0 0 24 24">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                        <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                    Notifications
                </a>
                <a href="#" onclick="closeSidebar()"
                    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-neutral-700 text-sm">
                    <svg width="17" height="17" fill="none" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                        <path
                            d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
                            stroke="currentColor" stroke-width="2" />
                    </svg>
                    Settings
                </a>
            </nav>
        </div>
        <div class="space-y-2">
            <div class="flex items-center justify-between px-3 py-2">
                <span class="text-xs text-gray-400 dark:text-gray-500 font-medium">Dark mode</span>
                <div class="toggle-track" onclick="toggleTheme()">
                    <div class="toggle-thumb"></div>
                </div>
            </div>
            <a href="#"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:bg-gray-50 dark:hover:bg-neutral-700 text-sm">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                    <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
                Log out
            </a>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="lg:ml-60 flex flex-col min-h-screen pb-16 lg:pb-0">

        <!-- Topbar -->
        <header
            class="bg-white dark:bg-neutral-800 border-b border-gray-100 dark:border-neutral-700 sticky top-0 z-10 px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <button onclick="openSidebar()"
                    class="lg:hidden text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 p-1 -ml-1">
                    <svg width="22" height="22" fill="none" viewBox="0 0 24 24">
                        <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
                <h1 style="font-family:'Syne',sans-serif;font-weight:700;"
                    class="text-xl sm:text-2xl text-gray-800 dark:text-gray-100 tracking-tight">Products</h1>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
                <div
                    class="hidden sm:flex items-center gap-2 bg-gray-50 dark:bg-neutral-700 border border-gray-200 dark:border-neutral-600 rounded-xl px-3 py-2 w-44 md:w-56">
                    <svg class="text-gray-400 flex-shrink-0" width="14" height="14" fill="none" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <input type="text" placeholder="Search…"
                        class="bg-transparent text-sm text-gray-700 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 outline-none w-full"
                        oninput="handleSearch(this.value)">
                </div>
                <button class="sm:hidden text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
                <button class="relative text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                        <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                        <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div
                    class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-br from-blue-400 to-brand flex items-center justify-center text-white font-semibold text-sm cursor-pointer select-none flex-shrink-0">
                    A</div>
                <!-- Theme toggle in topbar for mobile -->
                <div class="lg:hidden toggle-track" onclick="toggleTheme()">
                    <div class="toggle-thumb"></div>
                </div>
            </div>
        </header>

        <!-- Content -->
        <div class="flex-1 p-4 sm:p-6 lg:p-8">
            <div
                class="bg-white dark:bg-neutral-800 rounded-2xl border border-gray-100 dark:border-neutral-700 shadow-sm overflow-hidden">

                <!-- Toolbar -->
                <div
                    class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-4 sm:px-6 py-4 border-b border-gray-100 dark:border-neutral-700">
                    <div class="flex items-center gap-2">
                        <h2 class="font-semibold text-gray-800 dark:text-gray-100 text-[15px]">Products list</h2>
                        <span id="productCount"
                            class="text-xs font-medium text-gray-400 dark:text-gray-500 bg-gray-100 dark:bg-neutral-700 px-2 py-0.5 rounded-full"></span>
                    </div>
                    <!-- Mobile search bar -->
                    <div
                        class="sm:hidden flex items-center gap-2 bg-gray-50 dark:bg-neutral-700 border border-gray-200 dark:border-neutral-600 rounded-xl px-3 py-2">
                        <svg class="text-gray-400 flex-shrink-0" width="14" height="14" fill="none" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <input type="text" placeholder="Search products…"
                            class="bg-transparent text-sm text-gray-700 dark:text-gray-200 placeholder-gray-400 outline-none w-full"
                            oninput="handleSearch(this.value)">
                    </div>
                    <div class="flex items-center gap-2">
                        <button
                            class="flex items-center gap-1.5 border border-gray-200 dark:border-neutral-600 rounded-xl px-3 py-2 text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-neutral-700 font-medium">
                            <svg width="13" height="13" fill="none" viewBox="0 0 24 24">
                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
                            </svg>
                            Filter
                        </button>
                        <button
                            class="border border-gray-200 dark:border-neutral-600 rounded-xl px-3 py-2 text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-neutral-700 font-medium hidden sm:block">See
                            All</button>
                        <button class="add-btn" onclick="showAddModal()">
                            <svg width="13" height="13" fill="none" viewBox="0 0 24 24">
                                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5"
                                    stroke-linecap="round" />
                            </svg>
                            <span class="hidden sm:inline">Add Product</span>
                            <span class="sm:hidden">Add</span>
                        </button>
                    </div>
                </div>

                <!-- DESKTOP TABLE (md+) -->
                <div class="hidden md:block overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="border-b border-gray-100 dark:border-neutral-700">
                                <th class="w-10 px-5 py-3.5 text-left"><input type="checkbox" id="selectAll"
                                        onchange="toggleAll(this)"></th>
                                <th
                                    class="px-4 py-3.5 text-left text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                                    <span
                                        class="flex items-center gap-1 cursor-pointer hover:text-gray-600 dark:hover:text-gray-300">Product
                                        Name <svg class="sort-icon" width="10" height="10" fill="none"
                                            viewBox="0 0 24 24">
                                            <path d="M12 5v14M5 12l7-7 7 7" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" />
                                        </svg></span></th>
                                <th
                                    class="px-4 py-3.5 text-left text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                                    <span
                                        class="flex items-center gap-1 cursor-pointer hover:text-gray-600 dark:hover:text-gray-300">Category
                                        <svg class="sort-icon" width="10" height="10" fill="none" viewBox="0 0 24 24">
                                            <path d="M12 5v14M5 12l7-7 7 7" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" />
                                        </svg></span></th>
                                <th
                                    class="px-4 py-3.5 text-left text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                                    <span
                                        class="flex items-center gap-1 cursor-pointer hover:text-gray-600 dark:hover:text-gray-300">Price
                                        <svg class="sort-icon" width="10" height="10" fill="none" viewBox="0 0 24 24">
                                            <path d="M12 5v14M5 12l7-7 7 7" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" />
                                        </svg></span></th>
                                <th
                                    class="px-4 py-3.5 text-left text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                                    <span
                                        class="flex items-center gap-1 cursor-pointer hover:text-gray-600 dark:hover:text-gray-300">Stock
                                        <svg class="sort-icon" width="10" height="10" fill="none" viewBox="0 0 24 24">
                                            <path d="M12 5v14M5 12l7-7 7 7" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" />
                                        </svg></span></th>
                                <th
                                    class="px-4 py-3.5 text-left text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                                    <span
                                        class="flex items-center gap-1 cursor-pointer hover:text-gray-600 dark:hover:text-gray-300">Status
                                        <svg class="sort-icon" width="10" height="10" fill="none" viewBox="0 0 24 24">
                                            <path d="M12 5v14M5 12l7-7 7 7" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" />
                                        </svg></span></th>
                                <th
                                    class="px-4 py-3.5 text-right text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider">
                                    Action</th>
                            </tr>
                        </thead>
                        <tbody id="productTable"></tbody>
                    </table>
                </div>

                <!-- MOBILE CARD LIST (< md) -->
                <div class="md:hidden divide-y divide-gray-100 dark:divide-neutral-700" id="productCards"></div>

                <!-- Pagination -->
                <div
                    class="flex items-center justify-between px-4 sm:px-6 py-4 border-t border-gray-100 dark:border-neutral-700 gap-2">
                    <button onclick="changePage(currentPage-1)"
                        class="flex items-center gap-1.5 border border-gray-200 dark:border-neutral-600 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-neutral-700 font-medium">
                        <svg width="13" height="13" fill="none" viewBox="0 0 24 24">
                            <path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                        <span class="hidden sm:inline">Previous</span>
                    </button>
                    <div class="flex items-center gap-1" id="paginationNums"></div>
                    <button onclick="changePage(currentPage+1)"
                        class="flex items-center gap-1.5 border border-gray-200 dark:border-neutral-600 rounded-xl px-3 sm:px-4 py-2 text-xs sm:text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-neutral-700 font-medium">
                        <span class="hidden sm:inline">Next</span>
                        <svg width="13" height="13" fill="none" viewBox="0 0 24 24">
                            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV (mobile only) -->
    <nav id="bottomNav"
        class="fixed bottom-0 left-0 right-0 z-20 lg:hidden bg-white/90 dark:bg-neutral-800/90 border-t border-gray-200 dark:border-neutral-700 flex items-center justify-around px-2 py-2">
        <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1 text-gray-400 dark:text-gray-500">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor" opacity=".7" />
                <rect x="14" y="3" width="7" height="7" rx="1.5" fill="currentColor" />
                <rect x="3" y="14" width="7" height="7" rx="1.5" fill="currentColor" />
                <rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" opacity=".7" />
            </svg>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1 text-brand dark:text-blue-400">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
                <circle cx="12" cy="12" r="3" fill="currentColor" />
            </svg>
            <span class="text-[10px] font-semibold">Products</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1 text-gray-400 dark:text-gray-500">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                <path d="M3 17l4-8 4 4 4-6 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <span class="text-[10px] font-medium">Sales</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-0.5 px-3 py-1 text-gray-400 dark:text-gray-500">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" fill="none" />
            </svg>
            <span class="text-[10px] font-medium">Analytics</span>
        </a>
        <button onclick="openSidebar()"
            class="flex flex-col items-center gap-0.5 px-3 py-1 text-gray-400 dark:text-gray-500">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span class="text-[10px] font-medium">Menu</span>
        </button>
    </nav>

    <!-- ADD PRODUCT MODAL (bottom sheet on mobile, centered on desktop) -->
    <div id="modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center">
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="hideModal()"></div>
        <div
            class="relative bg-white dark:bg-neutral-800 rounded-t-3xl sm:rounded-2xl shadow-2xl w-full sm:max-w-md mx-0 sm:mx-4 p-5 sm:p-6 z-10 border border-gray-100 dark:border-neutral-700">
            <div class="sm:hidden w-10 h-1 bg-gray-300 dark:bg-neutral-600 rounded-full mx-auto mb-5"></div>
            <div class="flex items-center justify-between mb-5">
                <h3 style="font-family:'Syne',sans-serif;font-weight:700;"
                    class="text-lg text-gray-800 dark:text-gray-100">Add New Product</h3>
                <button onclick="hideModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
                        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label
                        class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5 uppercase tracking-wider">Product
                        Name</label>
                    <input id="newName" type="text" placeholder="e.g. Denim Jacket"
                        class="w-full border border-gray-200 dark:border-neutral-600 rounded-xl px-4 py-2.5 text-sm bg-transparent text-gray-800 dark:text-gray-100 placeholder-gray-300 dark:placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand/40 focus:border-brand">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label
                            class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5 uppercase tracking-wider">Category</label>
                        <select id="newCategory"
                            class="w-full border border-gray-200 dark:border-neutral-600 rounded-xl px-3 py-2.5 text-sm bg-white dark:bg-neutral-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand/40">
                            <option>Women Cloths</option>
                            <option>Man Cloths</option>
                            <option>Kid Cloths</option>
                            <option>Sweater</option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5 uppercase tracking-wider">Status</label>
                        <select id="newStatus"
                            class="w-full border border-gray-200 dark:border-neutral-600 rounded-xl px-3 py-2.5 text-sm bg-white dark:bg-neutral-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-brand/40">
                            <option>Active</option>
                            <option>Draft</option>
                            <option>Scheduled</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label
                            class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5 uppercase tracking-wider">Price
                            (₦)</label>
                        <input id="newPrice" type="number" inputmode="decimal" placeholder="0.00"
                            class="w-full border border-gray-200 dark:border-neutral-600 rounded-xl px-4 py-2.5 text-sm bg-transparent text-gray-800 dark:text-gray-100 placeholder-gray-300 dark:placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand/40">
                    </div>
                    <div>
                        <label
                            class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5 uppercase tracking-wider">Stock</label>
                        <input id="newStock" type="number" inputmode="numeric" placeholder="0"
                            class="w-full border border-gray-200 dark:border-neutral-600 rounded-xl px-4 py-2.5 text-sm bg-transparent text-gray-800 dark:text-gray-100 placeholder-gray-300 dark:placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand/40">
                    </div>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="hideModal()"
                    class="flex-1 border border-gray-200 dark:border-neutral-600 rounded-xl py-2.5 text-sm font-semibold text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-neutral-700">Cancel</button>
                <button onclick="addProduct()" class="add-btn flex-1 justify-center">Add Product</button>
            </div>
        </div>
    </div>

    <script>
        const allProducts = [
            { name: 'T-Shirt', category: 'Women Cloths', price: 79.80, stock: 79, status: 'Scheduled', color: '#f59e0b' },
            { name: 'Shirt', category: 'Man Cloths', price: 76.89, stock: 86, status: 'Active', color: '#6b7280' },
            { name: 'Pant', category: 'Kid Cloths', price: 86.65, stock: 74, status: 'Draft', color: '#92400e' },
            { name: 'Sweater', category: 'Man Cloths', price: 56.07, stock: 69, status: 'Active', color: '#1f2937' },
            { name: 'Sweater', category: 'Man Cloths', price: 56.07, stock: 69, status: 'Scheduled', color: '#374151' },
            { name: 'Light Jacket', category: 'Women Cloths', price: 36.00, stock: 65, status: 'Draft', color: '#3b82f6' },
            { name: 'Half Shirt', category: 'Man Cloths', price: 46.78, stock: 58, status: 'Active', color: '#d1d5db' },
            { name: 'Half Shirt', category: 'Sweater', price: 46.78, stock: 58, status: 'Active', color: '#60a5fa' },
            { name: 'Half Shirt', category: 'Man Cloths', price: 46.78, stock: 58, status: 'Scheduled', color: '#1f2937' },
            { name: 'Half Shirt', category: 'Kid', price: 46.78, stock: 58, status: 'Active', color: '#9ca3af' },
            { name: 'Hoodie', category: 'Man Cloths', price: 62.00, stock: 44, status: 'Active', color: '#4b5563' },
            { name: 'Cargo Pants', category: 'Kid Cloths', price: 49.99, stock: 33, status: 'Draft', color: '#6b7280' },
            { name: 'Denim Jacket', category: 'Women Cloths', price: 99.00, stock: 20, status: 'Active', color: '#2563eb' },
            { name: 'Polo Shirt', category: 'Man Cloths', price: 39.50, stock: 91, status: 'Scheduled', color: '#0f172a' },
            { name: 'Mini Skirt', category: 'Women Cloths', price: 29.95, stock: 55, status: 'Active', color: '#f43f5e' },
            { name: 'Blazer', category: 'Man Cloths', price: 120.00, stock: 18, status: 'Draft', color: '#1e293b' },
            { name: 'Summer Dress', category: 'Women Cloths', price: 54.90, stock: 47, status: 'Active', color: '#fbbf24' },
            { name: 'Kids Tee', category: 'Kid Cloths', price: 19.99, stock: 110, status: 'Active', color: '#10b981' },
            { name: 'Trench Coat', category: 'Women Cloths', price: 149.00, stock: 12, status: 'Scheduled', color: '#78350f' },
            { name: 'Joggers', category: 'Man Cloths', price: 44.00, stock: 63, status: 'Active', color: '#374151' },
        ];

        let filteredProducts = [...allProducts];
        const PAGE_SIZE = 10;
        let currentPage = 1;

        function getTotalPages() { return Math.max(1, Math.ceil(filteredProducts.length / PAGE_SIZE)); }

        function statusBadge(s) {
            const m = {
                Active: 'bg-green-50 text-green-600 border border-green-200 dark:bg-green-900/30 dark:text-green-400 dark:border-green-800',
                Scheduled: 'bg-blue-50 text-blue-600 border border-blue-200 dark:bg-blue-900/30 dark:text-blue-400 dark:border-blue-800',
                Draft: 'bg-amber-50 text-amber-600 border border-amber-200 dark:bg-amber-900/30 dark:text-amber-400 dark:border-amber-800',
            };
            return `<span class="status-badge inline-block px-2.5 py-1 rounded-lg ${m[s] || ''}">${s}</span>`;
        }

        function prodIcon(color) {
            return `<div class="prod-img" style="background:${color}22;"><svg width="20" height="20" fill="none" viewBox="0 0 24 24"><path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.57a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.57a2 2 0 00-1.34-2.23z" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
        }

        function renderTable() {
            const rows = filteredProducts.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
            document.getElementById('productTable').innerHTML = rows.map(p => `
      <tr class="row-hover border-b border-gray-50 dark:border-neutral-700/60 last:border-0">
        <td class="px-5 py-3.5"><input type="checkbox" class="row-check"></td>
        <td class="px-4 py-3.5"><div class="flex items-center gap-3">${prodIcon(p.color)}<span class="font-medium text-gray-800 dark:text-gray-100 text-[13.5px]">${p.name}</span></div></td>
        <td class="px-4 py-3.5 text-gray-500 dark:text-gray-400 text-[13px]">${p.category}</td>
        <td class="px-4 py-3.5 font-semibold text-gray-700 dark:text-gray-200 text-[13.5px]">₦${p.price.toFixed(2)}</td>
        <td class="px-4 py-3.5 text-gray-600 dark:text-gray-300 text-[13.5px]">${p.stock}</td>
        <td class="px-4 py-3.5">${statusBadge(p.status)}</td>
        <td class="px-4 py-3.5 text-right"><a href="#" class="text-brand dark:text-blue-400 font-semibold text-[13px] hover:underline">Details</a></td>
      </tr>`).join('');
            document.getElementById('productCount').textContent = filteredProducts.length + ' items';
        }

        function renderCards() {
            const rows = filteredProducts.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
            document.getElementById('productCards').innerHTML = rows.length
                ? rows.map(p => `
        <div class="flex items-center gap-3 px-4 py-3.5 hover:bg-gray-50 dark:hover:bg-neutral-700/50 transition-colors">
          ${prodIcon(p.color)}
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <span class="font-semibold text-gray-800 dark:text-gray-100 text-sm truncate">${p.name}</span>
              ${statusBadge(p.status)}
            </div>
            <div class="flex items-center gap-2 mt-0.5 flex-wrap">
              <span class="text-xs text-gray-400 dark:text-gray-500">${p.category}</span>
              <span class="text-xs text-gray-300 dark:text-gray-600">·</span>
              <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">₦${p.price.toFixed(2)}</span>
              <span class="text-xs text-gray-300 dark:text-gray-600">·</span>
              <span class="text-xs text-gray-500 dark:text-gray-400">${p.stock} in stock</span>
            </div>
          </div>
          <a href="#" class="text-brand dark:text-blue-400 text-xs font-semibold ml-1 flex-shrink-0">Details</a>
        </div>`).join('')
                : `<div class="py-12 text-center text-gray-400 text-sm">No products found</div>`;
        }

        function renderPagination() {
            const total = getTotalPages();
            let pages = [];
            if (total <= 5) pages = Array.from({ length: total }, (_, i) => i + 1);
            else if (currentPage <= 3) pages = [1, 2, 3, '...', total];
            else if (currentPage >= total - 2) pages = [1, '...', total - 2, total - 1, total];
            else pages = [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', total];
            document.getElementById('paginationNums').innerHTML = pages.map(p =>
                p === '...'
                    ? `<span class="px-1 text-gray-400 text-sm select-none">…</span>`
                    : `<button class="page-num ${p === currentPage ? 'active' : ''}" onclick="changePage(${p})">${p}</button>`
            ).join('');
        }

        function changePage(p) {
            const total = getTotalPages();
            if (p < 1 || p > total) return;
            currentPage = p;
            renderTable(); renderCards(); renderPagination();
            const sa = document.getElementById('selectAll');
            if (sa) sa.checked = false;
        }

        function toggleAll(cb) {
            document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked);
        }

        function handleSearch(q) {
            const lo = q.toLowerCase();
            filteredProducts = allProducts.filter(p =>
                p.name.toLowerCase().includes(lo) ||
                p.category.toLowerCase().includes(lo) ||
                p.status.toLowerCase().includes(lo)
            );
            currentPage = 1;
            renderTable(); renderCards(); renderPagination();
        }

        // Theme
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.toggle('dark', !isDark);
            html.classList.toggle('light', isDark);
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }
        (function () {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const useDark = saved === 'dark' || (!saved && prefersDark);
            document.documentElement.classList.toggle('dark', useDark);
            document.documentElement.classList.toggle('light', !useDark);
        })();

        // Sidebar
        function openSidebar() {
            const sb = document.getElementById('sidebar'), ov = document.getElementById('sidebarOverlay');
            ov.classList.remove('hidden');
            requestAnimationFrame(() => { ov.classList.remove('opacity-0'); sb.classList.remove('-translate-x-full'); });
            document.body.style.overflow = 'hidden';
        }
        function closeSidebar() {
            const sb = document.getElementById('sidebar'), ov = document.getElementById('sidebarOverlay');
            sb.classList.add('-translate-x-full');
            ov.classList.add('opacity-0');
            setTimeout(() => ov.classList.add('hidden'), 280);
            document.body.style.overflow = '';
        }

        // Modal
        function showAddModal() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }
        function hideModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
        }
        function addProduct() {
            const name = document.getElementById('newName').value.trim();
            const category = document.getElementById('newCategory').value;
            const status = document.getElementById('newStatus').value;
            const price = parseFloat(document.getElementById('newPrice').value) || 0;
            const stock = parseInt(document.getElementById('newStock').value) || 0;
            if (!name) { document.getElementById('newName').focus(); return; }
            const pal = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#8b5cf6', '#14b8a6', '#f43f5e'];
            allProducts.unshift({ name, category, price, stock, status, color: pal[Math.floor(Math.random() * pal.length)] });
            filteredProducts = [...allProducts];
            hideModal(); currentPage = 1;
            renderTable(); renderCards(); renderPagination();
            ['newName', 'newPrice', 'newStock'].forEach(id => document.getElementById(id).value = '');
        }

        // Init
        renderTable(); renderCards(); renderPagination();
    </script>
</body>

</html>
